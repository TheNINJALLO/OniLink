name: BDS metadata discovery
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e OniBridge/tools/bdsctl
      - run: python -m bdsctl resolve --channel stable --platform both --output bds.resolved.json
      - name: Report without downloading BDS
        shell: bash
        run: |
          echo '### Official stable BDS metadata' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat bds.resolved.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: bds-metadata-resolution, path: bds.resolved.json}

