name: Generate BDS profile candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    environment: bds-profile-generation
    runs-on: self-hosted
    env:
      MINECRAFT_EULA_ACCEPTED: ${{ vars.MINECRAFT_EULA_ACCEPTED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e OniBridge/tools/bdsctl -e OniBridge/tools/sdkgen
      - run: python -m bdsctl fetch --lock OniBridge/bds.lock.json
      - run: python -m bdsctl verify --lock OniBridge/bds.lock.json
      - name: Generate candidates with reviewed analysis inputs
        run: sh scripts/generate-profiles.sh
      - name: Validate candidates against both exact executables
        run: python tools/profile_pipeline.py validate --lock OniBridge/bds.lock.json --allow-candidate
      - name: Build and run the common executable hook harness
        run: |
          cmake -S OniBridge -B OniBridge/build/profile-harness -DONIBRIDGE_BUILD_PLUGIN=OFF -DONIBRIDGE_BUILD_TESTS=ON
          cmake --build OniBridge/build/profile-harness --config Release --parallel
          ctest --test-dir OniBridge/build/profile-harness -C Release --output-on-failure
      - name: Remove BDS-owned inputs
        if: always()
        run: python -m bdsctl clean && rm -rf .cache/bds build/bds-analysis
      - uses: actions/upload-artifact@v4
        with:
          name: onibridge-profile-candidates
          path: |
            OniBridge/generated
            OniBridge/profiles
          if-no-files-found: error
