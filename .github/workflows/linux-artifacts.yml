name: Linux Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: 0.3.0-beta.1
  push:
    branches: [main]
    paths:
      - "OniLink/**"
      - "OniBridge/**"
      - "packaging/pterodactyl/**"
      - "scripts/build-linux.sh"
      - "scripts/install-llvm18-ubuntu.sh"
      - "tools/check_linux_abi.py"
      - "tools/package_linux.py"
      - "tools/test_linux_abi.py"
      - "tools/test_pterodactyl_egg.py"
      - ".github/workflows/linux-artifacts.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: lukka/get-cmake@latest
      - name: Install Jammy LLVM 18 toolchain
        run: scripts/install-llvm18-ubuntu.sh
      - name: Build and package Linux release
        env:
          ONILINK_RELEASE_VERSION: ${{ inputs.version || '0.3.0-beta.1' }}
          ONIBRIDGE_CXX_COMPILER: clang++-18
        run: scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: onilink-linux-${{ inputs.version || '0.3.0-beta.1' }}
          path: dist/linux
          if-no-files-found: error
