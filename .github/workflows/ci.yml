name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: pip install ruff==0.15.7
      - run: ruff format --check tools OniBridge/tools/bdsctl OniBridge/tools/sdkgen
      - run: >-
          npx --yes prettier@3.6.2 --check
          OniLink/src/main/resources/dashboard/index.html
          OniLink/src/main/resources/dashboard/styles.css
          OniLink/src/main/resources/dashboard/app.js
      - run: sudo apt-get update && sudo apt-get install --yes clang-format-18
      - run: >-
          find OniBridge/src OniBridge/include OniBridge/tests -type f
          \( -name '*.cpp' -o -name '*.hpp' \) -print0
          | xargs -0 clang-format-18 --dry-run --Werror --style=file
  python-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -v
        working-directory: OniBridge/tools/bdsctl
      - run: python -m unittest discover -s tests -v
        working-directory: OniBridge/tools/sdkgen
      - run: python -m unittest test_package_release test_package_linux test_pterodactyl_egg test_linux_abi -v
        working-directory: tools
  onilink:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: ./gradlew test standaloneJar --no-daemon
        working-directory: OniLink
  onibridge-geyser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: ./OniLink/gradlew -p OniBridge-Geyser test jar --no-daemon
  onibridge-core:
    strategy:
      matrix: {os: [ubuntu-24.04, windows-2022]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - run: cmake -S OniBridge -B OniBridge/build/ci -DONIBRIDGE_BUILD_PLUGIN=OFF -DONIBRIDGE_BUILD_TESTS=ON
      - run: cmake --build OniBridge/build/ci --config Release
      - run: ctest --test-dir OniBridge/build/ci -C Release --output-on-failure
