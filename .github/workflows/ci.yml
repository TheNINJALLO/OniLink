name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -v
        working-directory: OniBridge/tools/bdsctl
      - run: python -m unittest discover -s tests -v
        working-directory: OniBridge/tools/sdkgen
      - run: python -m unittest test_package_release test_package_linux test_pterodactyl_egg -v
        working-directory: tools
  onilink:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: ./gradlew test standaloneJar --no-daemon
        working-directory: OniLink
  onibridge-geyser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: ./OniLink/gradlew -p OniBridge-Geyser test jar --no-daemon
  onibridge-core:
    strategy:
      matrix: {os: [ubuntu-24.04, windows-2022]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - run: cmake -S OniBridge -B OniBridge/build/ci -DONIBRIDGE_BUILD_PLUGIN=OFF -DONIBRIDGE_BUILD_TESTS=ON
      - run: cmake --build OniBridge/build/ci --config Release
      - run: ctest --test-dir OniBridge/build/ci -C Release --output-on-failure
